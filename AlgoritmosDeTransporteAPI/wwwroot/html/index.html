<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmos de transporte</title>
    <link rel="stylesheet" href="/AlgoritmosDeTransporteAPI/wwwroot/css/estilo.css">
</head>
<body>
    <header>
        <label for="">a</label>
        <nav>
            <ul>
                <li>Reiniciar</li>
                <li>Imprimir</li>
                <li>Guardar</li>
            </ul>
        </nav>
    </header>
    
    <main>
        <h1>Método de transporte</h1>

        <!-- ----------------------------------------- -->
        <section data-section="ingresar-datos">

            <div id="selector_tamano">
                <span>Ingresa la cantidad de lineas:</span>
                <select id="filas">
                    <option selected>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                </select>
            
                <span>Ingresa la cantidad de columnas:</span>
                <select id="columnas">
                    <option selected>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                </select>
                <button>Crear tabla</button>
            </div>
            
            <!-- tabla -->
            
            <div id="selector_metodo">
                <span>Selecciona un método</span>
                <select>
                    <option selected>Esquina noroeste</option>
                    <option>Voguel</option>
                    <option>Euler</option>
                </select>
            </div>
            
            
            <button>Solución paso a paso</button>
            <button>Solución directa</button>
        </section>


        <section data-section="procedimiento" hidden>

            <!-- tabla -->
                
            <div>
                <img>
                <textarea></textarea>
                <img>
                
            </div>
        </section>
    

        <!-- ----------------------------------------- -->

        <section id="resultados" hidden>

            <div>
                <div>
                    <img>
                    <span>Volver al inicio</span>
                </div>
                
                <div>
                    <img>
                    <span>Guardar</span>
                </div>
                
                <div>
                    <img>
                    <span>Imprimir</span>
                </div>
                
                <div>
                    <img>
                    <span>Continuar</span>
                </div>
            </div>

            <iframe></iframe>
        </section>
    </main>
</body>
</html>
