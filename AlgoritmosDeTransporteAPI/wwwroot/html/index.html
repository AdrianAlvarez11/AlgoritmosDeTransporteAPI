<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmos de transporte</title>
    <link rel="stylesheet" href="/AlgoritmosDeTransporteAPI/wwwroot/css/estilo.css">
    <script src="/AlgoritmosDeTransporteAPI/wwwroot/js/script.js"></script>
</head>
<body>
    <header>
        <label id="label_opciones">a</label>
        <nav class="invisible">
            <ul>
                <li><button>Reiniciar</button></li>
                <li><button>Imprimir</button></li>
                <li><button>Guardar</button></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <h1>Método de transporte</h1>

        <!-- ----------------------------------------- -->
        <section data-section="ingresar-datos">

            <div id="selector_tamano">
                <span>Ingresa la cantidad de lineas:</span>
                <select id="filas">
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            
                <span>Ingresa la cantidad de columnas:</span>
                <select id="columnas">
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
                <button id="crearTabla">Crear tabla</button>
            </div>
            
            <!-- tabla -->
            <div class="tabla-ingreso" id="tabla_ingreso"></div>
            

            <template id="template_header_inicial">
                <div class="header">
                    <span class="texto-header"></span>
                </div>
            </template>

            <template id="template_celda_input">
                <div class="celda">
                    <input type="number" class="input-celda" min="0">
                </div>
            </template>

            <div id="selector_metodo">
                <span>Selecciona un método:</span>
                <select>
                    <option selected>Esquina noroeste</option>
                    <option>Voguel</option>
                    <option>Euler</option>
                </select>
                
                
                <button>Solución paso a paso</button>
                <button>Solución directa</button>
            </div>
        </section>


        <section data-section="procedimiento" hidden>

            <!-- tabla -->
                
            <div>
                <img>
                <textarea></textarea>
                <img>
                
            </div>
        </section>
    

        <!-- ----------------------------------------- -->

        <section id="resultados" hidden>

            <div>
                <div>
                    <img>
                    <span>Volver al inicio</span>
                </div>
                
                <div>
                    <img>
                    <span>Guardar</span>
                </div>
                
                <div>
                    <img>
                    <span>Imprimir</span>
                </div>
                
                <div>
                    <img>
                    <span>Continuar</span>
                </div>
            </div>

            <iframe></iframe>
        </section>
    </main>
</body>
</html>
